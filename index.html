<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6f1e7">
    <title>The Illustrated Bible Story by Story</title>
    <link rel="stylesheet" href="styles.css?v=1">
  </head>
  <body>
    <header class="topbar">
      <div class="title-group"><p>DK illustrated edition</p><h1>The Illustrated Bible Story by Story</h1></div>
      <label class="size-control"><span>Page size</span><input id="pageSize" type="range" min="170" max="390" value="240"></label>
    </header>
    <details id="tocPanel" class="toc-panel">
      <summary>Table of contents</summary>
      <div id="tableOfContents" class="toc-content"></div>
    </details>
    <section class="search-row">
      <label class="search-box"><span>Search</span><input id="searchInput" type="search" placeholder="Search stories, people, places, or page text"></label>
      <span id="searchStatus" class="search-status" aria-live="polite">Search stories and page text</span>
    </section>
    <section id="searchResults" class="search-results" aria-label="Search results"></section>
    <main><section id="pageGrid" class="page-grid" aria-label="All pages"></section></main>
    <button id="scrollTop" class="scroll-top" type="button" aria-label="Scroll to top">↑</button>
    <div id="viewer" class="viewer" aria-hidden="true">
      <div class="viewer-toolbar">
        <button id="zoomOut" type="button" aria-label="Zoom out">−</button><span id="zoomLabel">Fit</span>
        <button id="zoomIn" type="button" aria-label="Zoom in">+</button><button id="fitPage" type="button">Fit</button>
        <button id="closeViewer" type="button" aria-label="Close">×</button>
      </div>
      <button id="prevPage" class="page-arrow page-arrow-prev" type="button" aria-label="Previous page">‹</button>
      <button id="nextPage" class="page-arrow page-arrow-next" type="button" aria-label="Next page">›</button>
      <div id="viewerPane" class="viewer-pane"><img id="viewerImage" alt=""></div>
    </div>
    <script src="book-data.js?v=1"></script><script src="viewer.js?v=1"></script>
  </body>
</html>
